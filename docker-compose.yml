services:
  app:
    build: .
    container_name: neonpass-app
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://neonpass:${DB_PASSWORD:?Définis DB_PASSWORD dans .env}@db:5432/neonpass
      WA_NUMBER: ${WA_NUMBER:?Définis WA_NUMBER dans .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définis ADMIN_PASSWORD dans .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.neonpass.rule=Host(`${DOMAIN:-neonpass.uned.live}`)
      - traefik.http.routers.neonpass.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.neonpass.tls=true
      - traefik.http.routers.neonpass.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.neonpass.loadbalancer.server.port=3000

  db:
    image: postgres:16-alpine
    container_name: neonpass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neonpass
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définis DB_PASSWORD dans .env}
      POSTGRES_DB: neonpass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neonpass -d neonpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  db_data:
